# main 上每合进 3 个用户能感觉到的 PR(标题是 feat / fix / perf)就自动发一版：在最高的正式版上把最后一位加 1,
# 先跑 go test,通过后打 tag,再在这个 tag 上运行 Release。怎么数、怎么算版本号见 .github/scripts/next-version.sh。
# 用 workflow 的 token 推的 tag 不会触发 release.yml 的 push 事件，所以改用 workflow_dispatch 在 tag 上运行它。
# 手动推 tag(如从 v0.0.4 跳到 v0.1.0)照常发布，之后从那个版本接着数。
name: Auto release

on:
  push:
    branches: [main]

permissions:
  contents: read

# 前后脚合并的几次推送排队跑，同一时刻只有一次在判断和打 tag。
concurrency:
  group: auto-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide version
        id: next
        run: |
          version="$(.github/scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$version" ]]; then
            echo "发布 v$version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "能计数的 PR 还不够，这次不发版" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-go@v6
        if: steps.next.outputs.version != ''
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # 桌面端的 Go 包要编译 Wails 的 cgo 代码，Linux 上需要 GTK 与 WebKit 的头文件。
      - name: Install Linux dependencies
        if: steps.next.outputs.version != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Test
        if: steps.next.outputs.version != ''
        run: go test ./...

      # 推之前重新拉一次 tag:这期间有人手动推了更高的版本，就不再打这个旧的，免得它在 GitHub 上成了最新版。
      - name: Tag and release
        if: steps.next.outputs.version != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git fetch --tags --force --quiet
          highest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [[ "$(printf '%s\n' "$highest" "v$VERSION" | sort -V | tail -n 1)" != "v$VERSION" || "$highest" == "v$VERSION" ]]; then
            echo "已经有 $highest,不再打 v$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
          echo "已打 v$VERSION 并触发 Release" >> "$GITHUB_STEP_SUMMARY"
