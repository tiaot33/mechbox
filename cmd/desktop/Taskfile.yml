version: '3'

vars:
  APP_NAME: "mechbox"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # dev 系列任务给 wails3 dev 的 Vite 端口：设了 WAILS_VITE_PORT 就用它，否则向系统要一个空闲端口，
  # 几个工作区同时开窗口不抢同一个端口。wails3 dev 再用 WAILS_VITE_PORT 把端口传给 dev:frontend(上面的 VITE_PORT)。
  DEV_VITE_PORT_CMD: >-
    echo "${WAILS_VITE_PORT:-$(node -e "const s=require('net').createServer().listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")}"
  # private_mac_apis:macOS 上让 WebView 透明、透出原生毛玻璃所需(Wails v3 默认不开);
  # 用了私有 API,不能上 Mac App Store。其他平台上这个标签不起作用。
  EXTRA_TAGS: '{{.EXTRA_TAGS | default "private_mac_apis"}}'
  # 构建 / 打包 / 运行的目标系统，默认为本机;可用 `wails3 build GOOS=...` 覆盖以交叉编译。
  GOOS: '{{.GOOS | default OS}}'
  # 开发数据的目录(dev:seed 生成，dev:seeded 使用):devseed 在里面放 home/(临时 HOME)与 library.db。
  SEED_DIR: '{{.ROOT_DIR}}/.dev/seed'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  # 打出发布用的安装包放进 dist/(先清空),只打本机系统、本机架构的。.github/workflows/release.yml 在各平台上跑的就是这个任务，
  # 本机跑同一条命令就能复现 CI 的打包。文件名是 app 里的更新依赖的约定(见 README 的「发布」),改名前先改 release_<平台>.go。
  # VERSION 只用在文件名里，没给或为空时是 dev-<提交前 7 位>;写进构建配置的版本号由 .github/scripts/set-version.sh 负责。
  # Windows 上的文件操作用 PowerShell:在 PowerShell / cmd 里运行时 PATH 里通常没有 rm、mkdir、mv。
  release:
    summary: Packages the release installers for this OS into dist/
    vars:
      COMMIT:
        sh: git rev-parse HEAD
      VERSION: '{{.VERSION | default (print "dev-" (trunc 7 .COMMIT))}}'
    cmds:
      - cmd: rm -rf dist && mkdir -p dist
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist; New-Item -ItemType Directory dist | Out-Null"
        platforms: [windows]
      - task: release:{{OS}}
        vars:
          NAME: Mechbox-{{.VERSION}}

  release:darwin:
    internal: true
    cmds:
      - task: darwin:package:universal
      - task: darwin:create:dmg
      - mv "{{.BIN_DIR}}/{{.APP_NAME}}.dmg" "dist/{{.NAME}}-macos-universal.dmg"
      # app 里的更新下载这个 zip 替换 mechbox.app。顶层只能有 mechbox.app 一项，所以不带扩展属性(否则多出 __MACOSX)。
      - ditto -c -k --norsrc --noextattr --noacl --keepParent "{{.BIN_DIR}}/{{.APP_NAME}}.app" "dist/{{.NAME}}-macos-universal.zip"

  # go-sqlite3 依赖 cgo;Windows 的任务默认 CGO_ENABLED=0,编出来的程序打不开数据库。
  # 另起一次 wails3 task 传 CGO_ENABLED:用 task 调用时传的变量到不了被调任务再往下调的 build。
  release:windows:
    internal: true
    cmds:
      - wails3 task windows:package CGO_ENABLED=1
      - powershell -NoProfile -Command "Move-Item -Force '{{.BIN_DIR}}/{{.APP_NAME}}-{{ARCH}}-installer.exe' 'dist/{{.NAME}}-windows-{{ARCH}}-setup.exe'"

  # nfpm.yaml 的 arch 取自环境变量 GOARCH(维护者取自 GIT_COMMITTER_NAME / GIT_COMMITTER_EMAIL,CI 里设)。
  # 另起一次 wails3 task 让它带上这个环境变量:task 的 env 只给自己的命令，到不了它调用的任务。
  release:linux:
    internal: true
    env:
      GOARCH: '{{ARCH}}'
    cmds:
      - wails3 task linux:package
      - mv "{{.BIN_DIR}}"/{{.APP_NAME}}-*.AppImage "dist/{{.NAME}}-linux-{{ARCH}}.AppImage"
      - mv "{{.BIN_DIR}}/{{.APP_NAME}}.deb" "dist/{{.NAME}}-linux-{{ARCH}}.deb"
      - mv "{{.BIN_DIR}}/{{.APP_NAME}}.rpm" "dist/{{.NAME}}-linux-{{ARCH}}.rpm"
      - mv "{{.BIN_DIR}}/{{.APP_NAME}}.pkg.tar.zst" "dist/{{.NAME}}-linux-{{ARCH}}.pkg.tar.zst"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    vars:
      DEV_VITE_PORT:
        sh: '{{.DEV_VITE_PORT_CMD}}'
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.DEV_VITE_PORT}}

  # 用固定的测试数据库 .dev/library.db 以开发模式运行，不碰真实技能库;设置(令牌、同步等)存在这个数据库里，填一次就一直在。
  # Agent 目录仍按真实 HOME 算，要连安装也隔离就再给一个临时 HOME(见 README)。
  dev:test-db:
    summary: Runs the application in development mode against the test database .dev/library.db
    vars:
      DEV_VITE_PORT:
        sh: '{{.DEV_VITE_PORT_CMD}}'
    env:
      MECHBOX_LIBRARY: '{{.ROOT_DIR}}/.dev/library.db'
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.DEV_VITE_PORT}}

  # 重建开发数据 .dev/seed:临时 HOME(Agent 目录、项目、本地 Git 来源)与其中的数据库，用 testdata/dev 里的技能快照，不联网。
  # 只清 .dev/seed,不动 dev:test-db 的 .dev/library.db;中途失败时删掉 .dev/seed。只支持 macOS 与 Linux。
  dev:seed:
    summary: Rebuilds the development data in .dev/seed from testdata/dev
    cmds:
      - go run ./devseed -out '{{.SEED_DIR}}' -data testdata/dev

  # 用 dev:seed 生成的开发数据以开发模式运行:HOME 与数据库都在 .dev/seed 里，安装也不碰真实的 Agent 目录。
  # Go 的缓存指回原处，免得在临时 HOME 下重新下载依赖。
  dev:seeded:
    summary: Runs the application in development mode against the development data in .dev/seed
    vars:
      GO_MODCACHE:
        sh: go env GOMODCACHE
      GO_CACHE:
        sh: go env GOCACHE
      DEV_VITE_PORT:
        sh: '{{.DEV_VITE_PORT_CMD}}'
    preconditions:
      - sh: '[ "{{OS}}" != windows ]'
        msg: 开发数据只支持 macOS 与 Linux:Windows 上技能库按 USERPROFILE 取主目录，换 HOME 隔离不了
      - sh: test -f '{{.SEED_DIR}}/library.db'
        msg: 还没有开发数据，先运行 wails3 task dev:seed
    # 环境变量写在命令里:Taskfile 的 env 不覆盖系统里已有的 HOME。
    cmds:
      - >-
        HOME='{{.SEED_DIR}}/home'
        MECHBOX_LIBRARY='{{.SEED_DIR}}/library.db'
        GOMODCACHE='{{.GO_MODCACHE}}' GOCACHE='{{.GO_CACHE}}'
        wails3 dev -config ./build/config.yml -port {{.DEV_VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker
